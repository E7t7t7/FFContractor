name: Userscript regression
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check FFContractor.user.js
      - run: node TEST_FFCONTRACTOR.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python BUILD_MOBILE.py
      - run: git diff --exit-code -- FFContractor.user.js
      - run: node TEST_MOBILE_CORE.js
      - run: node TEST_MOBILE_HOST.js
      - run: node TEST_MOBILE_WORKER.js
      - name: Install browser regression runtime
        run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node TEST_BROWSER_RENDER.js
      - run: node TEST_MOBILE_NAVIGATION.js
